id: guide_assignment
description: "Guide assignment benchmark: seven assignment configurations evaluated against published reference labels, with main and supplementary methodology-defined metrics."
version: "0.2.0"
benchmarker: "Yunzhe Liu, richelieu.xmas@gmail.com"

software_backend: conda
software_environments:
  assignment_py:
    description: "pgmm/umi + light (GT-only) metrics. Exported from scp_analysis (the env that produced the archive)."
    conda: envs/assignment_py.yml
  assignment_crispat:
    description: "crispat SVI (pgmm/2beta). Exported from the crispat env."
    conda: envs/assignment_crispat.yml
  assignment_fishash:
    description: "fishash (R). Exported from scprocess_rlibs."
    conda: envs/assignment_fishash.yml
  assignment_metrics:
    description: "GEX metrics + difficulty. Same stack as assignment_py."
    conda: envs/assignment_metrics.yml

stages:
  # ============================ data ============================
  # Primary benchmark: Replogle K562, two guide extractions.  The reference-label
  # terminology is intentional: it describes agreement with a published reference,
  # rather than claiming experimental ground truth.
  - id: data
    modules:
      - id: replogle_ham
        name: "Replogle K562 / HAM"
        software_environment: assignment_py
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-data.git
          commit: 92ee17693aedbc44637360ff72d86ad45ce096d0
        parameters:
          - mex_dir: "/data/yunzliu/results/guide_extraction/hash_matcher_final/merged/"
            reference: "/data/yunzliu/references/published/K562_essential_raw_singlecell_01.h5ad"
            gex: "/data/yunzliu/Replogle2022_K562_Day6_benchmark/02_gex/post_decontx/TruSeq_decontx_merged_48lanes.h5ad"
            guide_map: "/data/yunzliu/references/raw_guides_k562_essential.csv"
            gene_symbol_to_ensg: "/data/yunzliu/assignment_benchmark_starter/benchmark_output/gene_symbol_to_ensg.json"
            guide_design: "dual"
            match_regime: "lane_16mer"
            collapse_lanes: "false"
            perturbation_type: "knockdown"
            knockdown_applicable: "true"
      - id: replogle_simpleaf
        name: "Replogle K562 / simpleaf_k15"
        software_environment: assignment_py
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-data.git
          commit: 92ee17693aedbc44637360ff72d86ad45ce096d0
        parameters:
          - mex_dir: "/data/yunzliu/assignment_benchmark_starter/04_extraction_mex/simpleaf_k15/"
            reference: "/data/yunzliu/references/published/K562_essential_raw_singlecell_01.h5ad"
            gex: "/data/yunzliu/Replogle2022_K562_Day6_benchmark/02_gex/post_decontx/TruSeq_decontx_merged_48lanes.h5ad"
            guide_map: "/data/yunzliu/references/raw_guides_k562_essential.csv"
            gene_symbol_to_ensg: "/data/yunzliu/assignment_benchmark_starter/benchmark_output/gene_symbol_to_ensg.json"
            guide_design: "dual"
            match_regime: "lane_16mer"
            collapse_lanes: "false"
            perturbation_type: "knockdown"
            knockdown_applicable: "true"
    outputs:
      - { id: data.matrix,    path: "{dataset}_matrix.mtx.gz" }
      - { id: data.barcodes,  path: "{dataset}_barcodes.tsv.gz" }
      - { id: data.features,  path: "{dataset}_features.tsv.gz" }
      - { id: data.reference_labels, path: "{dataset}_reference.h5ad" }
      - { id: data.gex,       path: "{dataset}_gex.h5ad" }
      - { id: data.guide_map, path: "{dataset}_guide_map.csv" }
      - { id: data.gene_symbol_to_ensg, path: "{dataset}_gene_symbol_to_ensg.json" }
      - { id: data.spec,      path: "{dataset}_spec.json" }
      - { id: data.difficulty_table, path: "{dataset}_cell_difficulty.tsv" }

  # ======================= guide_assignment =======================
  # Seven configurations/(dataset): MAP-EM PGMM, UMI{3,5,10}, crispat{pgmm,2beta}, fishash.
  # All consume the MEX trio; all emit a base-column assignments.csv.
  - id: guide_assignment
    modules:
      - id: pgmm
        name: "PGMM_EM (MAP-EM)"
        software_environment: assignment_py
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-pgmm.git
          commit: be85a69a1082b143dba2f810109716fd2da5d9d1
        parameters:
          - variant: "map_e2"
            umi_threshold: 1
            prob_threshold: 0.75
            workers: 8
      - id: umi
        name: "UMI threshold (t3/t5/t10)"
        software_environment: assignment_py
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-umi.git
          commit: ac6a2a84d73cf9295e9d8822fd36549f959d9bc7
        parameters:
          - threshold: [3, 5, 10]
            workers: 8
      - id: crispat
        name: "crispat (pgmm / 2beta)"
        software_environment: assignment_crispat
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-crispat.git
          commit: 6eb4c6ba5ffef4835666ae7056685af3d46cd300
        parameters:
          - crispat_method: ["pgmm", "2beta"]
            umi_threshold: 0
            workers: 8
      - id: fishash
        name: "fishash (R)"
        software_environment: assignment_fishash
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-fishash.git
          commit: e92fcff0699e4b84e0c133714ef632e75e0b4afa
        parameters:
          - padj_cutoff: 0.05
            min_count: 2
            refit: 10
    inputs:
      - data.matrix
      - data.barcodes
      - data.features
    outputs:
      - { id: guide_assignment.assignments, path: "assignments.csv" }
      - { id: guide_assignment.monitoring, path: "monitoring.json" }

  # ---- metrics: per-lineage scores; metric selection via --metric.
  # NOTE: each metric group is its OWN single-module stage. OB 0.6.0's DAG builder
  # is nondeterministic when one stage holds multiple modules sharing an output id
  # (fan-out over lineages silently collapses ~half the time); one module per stage
  # makes fan-out deterministic. Verified stable across runs incl. PYTHONHASHSEED=0.
  - id: metrics_reference
    modules:
      - id: gt_metrics
        name: "Reference agreement and difficulty-stratified agreement"
        software_environment: assignment_py
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-metrics.git
          commit: 4f6edc35c17a1780b5118b0a2f33f5135de6e8b1
        parameters:
          - metric: ["reference_agreement", "stratified_reference_agreement"]
    inputs:
      - guide_assignment.assignments
      - data.reference_labels
      - data.guide_map
      - data.spec
      - data.difficulty_table
    outputs:
      - { id: metrics_reference.scores, path: "{params.metric}.scores.json" }

  - id: metrics_gex
    modules:
      - id: gex_metrics
        name: "Knockdown and difficulty-stratified knockdown"
        software_environment: assignment_metrics
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-metrics.git
          commit: 4f6edc35c17a1780b5118b0a2f33f5135de6e8b1
        parameters:
          - metric: ["knockdown", "stratified_knockdown"]
    inputs:
      - guide_assignment.assignments
      - data.reference_labels
      - data.guide_map
      - data.spec
      - data.gex
      - data.difficulty_table
    outputs:
      - { id: metrics_gex.scores, path: "{params.metric}.scores.json" }

  - id: metrics_discovery
    modules:
      - id: discovery_metric
        name: "Differential-expression discovery (FPR supplementary)"
        software_environment: assignment_metrics
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-metrics.git
          commit: 4f6edc35c17a1780b5118b0a2f33f5135de6e8b1
        parameters:
          - metric: ["differential_expression_discovery"]
        resources: { mem_mb: 180000, cpu: 8 }
    inputs:
      - guide_assignment.assignments
      - data.reference_labels
      - data.guide_map
      - data.spec
      - data.gex
    outputs:
      - { id: metrics_discovery.scores, path: "{params.metric}.scores.json" }

  - id: metrics_resources
    modules:
      - id: method_resources
        name: "Assignment resources under the fixed 8-core protocol"
        software_environment: assignment_py
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-metrics.git
          commit: 4f6edc35c17a1780b5118b0a2f33f5135de6e8b1
        parameters:
          - metric: "method_resources"
    inputs:
      - guide_assignment.monitoring
      - data.spec
      - guide_assignment.assignments
      - data.reference_labels
      - data.guide_map
    outputs:
      - { id: metrics_resources.scores, path: "{params.metric}.scores.json" }

  - id: metrics_supplementary
    modules:
      - id: supplementary_metrics
        name: "Supplementary construct-level reference agreement"
        software_environment: assignment_py
        repository:
          url: https://github.com/tmp-perturb/guide-assignment-metrics.git
          commit: 4f6edc35c17a1780b5118b0a2f33f5135de6e8b1
        parameters:
          - metric: "construct_set_agreement"
    inputs:
      - guide_assignment.assignments
      - data.reference_labels
      - data.guide_map
      - data.spec
    outputs:
      - { id: metrics_supplementary.scores, path: "{params.metric}.scores.json" }

# ---- cross-lineage supplementary collectors and methodology-aware aggregation ----
# NB `parameters[].id: collector_param` below is a required placeholder with no
# semantics: OB auto-generates parameter ids for stages[].modules[].parameters but
# NOT for metric_collectors[].parameters, while Parameter.id is mandatory. The value
# is never passed to the entrypoint (only `--collector <name>` is) and is safe to
# repeat across collectors — the param hash is computed from the params, not the id.
# Collector outputs land in out/<param_hash>/<file>, not at the bare `path:` below.
metric_collectors:
  - id: pairwise_top1_agreement
    name: "Pairwise Top-1 assignment agreement across configurations"
    software_environment: assignment_metrics
    repository:
      url: https://github.com/tmp-perturb/guide-assignment-metrics.git
      commit: 4f6edc35c17a1780b5118b0a2f33f5135de6e8b1
      entrypoint: collectors
    parameters:
      - id: collector_param
        collector: "pairwise_top1_agreement"
    inputs:
      - guide_assignment.assignments
    outputs:
  - id: aggregate
    name: "Aggregate methodology main and supplementary metrics"
    software_environment: assignment_metrics
    repository:
      url: https://github.com/tmp-perturb/guide-assignment-metrics.git
      commit: 4f6edc35c17a1780b5118b0a2f33f5135de6e8b1
      entrypoint: aggregate
    inputs:
      - metrics_reference.scores
      - metrics_gex.scores
      - metrics_discovery.scores
      - metrics_resources.scores
      - metrics_supplementary.scores
    outputs:
      - { id: aggregate.main_tsv, path: "main_metrics.tsv" }
      - { id: aggregate.main_parquet, path: "main_metrics.parquet" }
      - { id: aggregate.supplementary_tsv, path: "supplementary_metrics.tsv" }
      - { id: aggregate.supplementary_parquet, path: "supplementary_metrics.parquet" }
